services:
  - type: web
    name: flashchat-server
    env: node
    rootDir: server
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://your-vercel-domain
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB_NAME
        value: flashchat
      - key: REDIS_URL
        sync: false
      - key: REDIS_PREFIX
        value: flashchat
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 200
